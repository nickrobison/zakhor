name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TRACKER_ENDPOINT: http://localhost:9999

jobs:
  # ── Backend ──────────────────────────────────────────────────────
  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libglib2.0-dev libtracker-sparql-3.0-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  backend-test:
    runs-on: ubuntu-latest
    env:
      FASTEMBED_CACHE_DIR: ${{ github.workspace }}/.fastembed_cache
      FASTEMBED_MODEL_CACHE_KEY: bge-small-en-v1.5
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libglib2.0-dev libtracker-sparql-3.0-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.fastembed_cache
          key: ${{ runner.os }}-fastembed-${{ env.FASTEMBED_MODEL_CACHE_KEY }}
          restore-keys: |
            ${{ runner.os }}-fastembed-
      - name: Run tests with count guard
        run: |
          cargo test --workspace 2>&1 | tee test-output.log
          COUNT=$(grep -c "^test " test-output.log)
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::Zero tests ran"
            exit 1
          fi

  # ── Frontend ─────────────────────────────────────────────────────
  frontend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ui
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ./ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint

  frontend-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ui
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ./ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck

  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ui
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ./ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ui
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ./ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

  # ── Python integration tests ─────────────────────────────────────
  python-test:
    runs-on: ubuntu-latest
    env:
      HF_HUB_CACHE: ${{ github.workspace }}/.hf_cache
      HF_HUB_MODEL_KEY: gliner-relex-onnx
    steps:
      - uses: actions/checkout@v4

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libglib2.0-dev libtracker-sparql-3.0-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.hf_cache
          key: ${{ runner.os }}-hf-${{ env.HF_HUB_MODEL_KEY }}
          restore-keys: |
            ${{ runner.os }}-hf-

      - name: Build Rust binary
        run: cargo build

      - name: Pre-download GLiNER model
        env:
          HF_HUB_CACHE: ${{ github.workspace }}/.hf_cache
        run: |
          # Start server in ephemeral mode — this triggers the model download
          # in a background task (see MemoryHandler::new_with_config).
          mkdir -p /tmp/zakhor-predownload
          target/debug/zakhor --http --ephemeral --db-path=/tmp/zakhor-predownload &
          PID=$!
          echo "Server pid=$PID, waiting for model..."

          # Poll for the model files in the hf_hub cache.
          # The refs/main file is written atomically after download completes.
          OK=0
          for i in $(seq 90); do
            if [ -f "$HF_HUB_CACHE/models--nickrobison--gliner-relex-onnx/refs/main" ]; then
              echo "Model downloaded and cached after $((i * 2))s"
              ls -lh "$HF_HUB_CACHE/models--nickrobison--gliner-relex-onnx/snapshots/"*/model.onnx
              OK=1
              break
            fi
            sleep 2
          done

          kill $PID 2>/dev/null || true
          wait $PID 2>/dev/null || true
          rm -rf /tmp/zakhor-predownload

          if [ "$OK" != "1" ]; then
            echo "WARNING: model pre-download did not complete — tests will attempt download at runtime"
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Python dependencies
        working-directory: ./tests/python
        run: uv sync --frozen

      - name: Run Python tests
        working-directory: ./tests/python
        run: uv run pytest -v --timeout=180

  # ── End-to-end ───────────────────────────────────────────────────
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ui
    steps:
      - uses: actions/checkout@v4

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libglib2.0-dev libtracker-sparql-3.0-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ./ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm run build

      - name: Build Rust server
        run: cargo build
        working-directory: .

      - name: Start Rust server (validate startup)
        run: |
          nohup target/debug/zakhor --http > /tmp/zakhor.log 2>&1 &
          sleep 2
          echo "--- Rust server log (may fail without Tracker) ---"
          cat /tmp/zakhor.log || true
        working-directory: .

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium

      - name: Run Playwright tests
        run: pnpm run e2e

      - name: Cleanup background server
        if: always()
        run: |
          pkill -f "target/debug/zakhor" 2>/dev/null || true
