name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TRACKER_ENDPOINT: http://localhost:9999

jobs:
  # ── Backend ──────────────────────────────────────────────────────
  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libglib2.0-dev libtracker-sparql-3.0-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  backend-test:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: never
      FASTEMBED_CACHE_DIR: ${{ github.workspace }}/.fastembed_cache
      FASTEMBED_MODEL_CACHE_KEY: bge-small-en-v1.5
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Run backend tests
        env:
          CARGO_TERM_COLOR: never
        run: cargo test --workspace 2>&1 | tee test-output.log
      - name: Verify tests actually ran
        run: |
          echo "=== test-output.log ==="
          ls -la test-output.log 2>&1 || echo "FILE MISSING"
          head -20 test-output.log 2>&1 || true
          echo "=== grep debug ==="
          grep -ac "test result:" test-output.log || true
          wc -l test-output.log 2>&1
          COUNT=$(grep -ac "test result:" test-output.log || true)
          echo "COUNT=$COUNT"
          if [ ! -s test-output.log ]; then
            echo "::error::test-output.log is empty or missing — no test output captured"
            exit 1
          fi
          if [ "$COUNT" -lt 1 ]; then
            echo "::error::Zero test result lines — check for silent skip regressions"
            exit 1
          fi
          fi

  # ── Frontend ─────────────────────────────────────────────────────
  frontend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ui
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: ./ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint

  frontend-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ui
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: ./ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck

  # ── Python integration tests ─────────────────────────────────────
  python-test:
    runs-on: ubuntu-latest
    env:
      HF_HUB_CACHE: ${{ github.workspace }}/.hf_cache
      HF_HUB_MODEL_KEY: gliner-relex-onnx
    steps:
      - uses: actions/checkout@v4

      - name: Install tinysparql runtime
        run: |
          sudo apt-get update
          # Enable universe for tinysparql package
          sudo add-apt-repository -y universe 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libtracker-sparql-3.0-dev
          # Install tinysparql CLI (provides 'tinysparql endpoint' subcommand)
          sudo apt-get install -y tinysparql || {
            echo "tinysparql package not available, checking for tracker3 alternative..."
            # Try tracker3 as fallback (TinySPARQL renamed from Tracker)
            sudo apt-get install -y tracker3 2>/dev/null || true
          }

      - name: Start tinysparql endpoint
        run: |
          tinysparql endpoint --port=7200 &
          sleep 3
          echo "tinysparql ready on port 7200"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: Swatinem/rust-cache@v2

      - name: Build Rust binary
        run: cargo build

      - name: Pre-download GLiNER model
        env:
          HF_HUB_CACHE: ${{ github.workspace }}/.hf_cache
        run: |
          # Start server in ephemeral mode — this triggers the model download
          # in a background task (see MemoryHandler::new_with_config).
          mkdir -p /tmp/zakhor-predownload
          target/debug/zakhor --http --ephemeral --db-path=/tmp/zakhor-predownload &
          PID=$!
          echo "Server pid=$PID, waiting for model..."

          # Poll for the model files in the hf_hub cache.
          # The refs/main file is written atomically after download completes.
          OK=0
          for i in $(seq 90); do
            if [ -f "$HF_HUB_CACHE/models--nickrobison--gliner-relex-onnx/refs/main" ]; then
              echo "Model downloaded and cached after $((i * 2))s"
              ls -lh "$HF_HUB_CACHE/models--nickrobison--gliner-relex-onnx/snapshots/"*/model.onnx
              OK=1
              break
            fi
            sleep 2
          done

          kill $PID 2>/dev/null || true
          wait $PID 2>/dev/null || true
          rm -rf /tmp/zakhor-predownload

          if [ "$OK" != "1" ]; then
            echo "WARNING: model pre-download did not complete — tests will attempt download at runtime"
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: astral-sh/setup-uv@v6

      - name: Install Python test deps
        working-directory: ./tests/python
        run: uv sync --frozen

      - name: Run Python tests
        working-directory: ./tests/python
        run: uv run pytest -v --timeout=180

      - name: Cleanup tinysparql
        if: always()
        run: pkill -f tinysparql 2>/dev/null || true
