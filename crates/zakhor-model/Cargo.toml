[package]
name = "zakhor-model"
version = "0.1.0"
edition = "2024"

[lib]

[features]
gliner-integration = []

[dependencies]
zakhor-common = { workspace = true }
zakhor-storage = { workspace = true }
zakhor-search = { workspace = true }

thiserror = "2"
gio = { workspace = true }
tracker-rs = { workspace = true }
oxrdf = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
oxiri = { workspace = true, features = ["serde"] }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
utoipa = { workspace = true }

# HuggingFace Hub model downloads
hf-hub = "0.5"

# GLiNER extraction pipeline - using forked gline-rs/orp with ort =2.0.0-rc.12 to match fastembed
# load-dynamic must stay off: Cargo feature unification would override fastembed's
# statically linked ort/download-binaries, requiring libonnxruntime.so at runtime.
gline-rs = { git = "https://github.com/nickrobison/gline-rs", branch = "ort-rc12" }
orp = { git = "https://github.com/nickrobison/orp", branch = "ort-rc12" }
ort = { version = "2.0.0-rc.12" }
